<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>이능 전투 · 도트 아틀리에</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#ede6d8;background:#171c27}*{box-sizing:border-box}body{margin:0}main{max-width:1280px;margin:auto;padding:48px 32px}header{display:flex;justify-content:space-between;gap:30px;align-items:end;border-bottom:1px solid #40444f;padding-bottom:28px}h1{font-size:36px;letter-spacing:-1.7px;font-weight:650;margin:6px 0 12px}.eyebrow{font-size:11px;letter-spacing:3px;color:#b7cebe}.intro{color:#a8acba;font-size:14px;line-height:1.7;margin:0}.stats{display:flex;gap:24px;flex-shrink:0}.stats strong{font-family:monospace;font-size:30px;font-weight:400}.stats span{display:block;font-size:11px;color:#a8acba;margin-top:6px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:0;background:#171c27ed;backdrop-filter:blur(8px);padding:20px 0;z-index:1}button,select,a.button{font:inherit;font-size:13px;border:1px solid #454957;background:#242a37;color:#eee8dc;padding:9px 15px;border-radius:6px;cursor:pointer;text-decoration:none}button.on{background:#c6dfc7;color:#1c3028;border-color:#c6dfc7}.toolbar .spacer{flex:1}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.card{padding:0;text-align:left;background:#232936;border:1px solid #333a49;overflow:hidden;transition:border-color .15s}.card:hover{border-color:#bdd3bd}.stage{display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 68%,#353d4b 0,transparent 65%);height:206px;position:relative}.stage:after{content:'';position:absolute;bottom:12px;height:1px;width:52%;background:#454e5c}canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}.card canvas{width:192px;height:192px}.info{border-top:1px solid #353c49;padding:13px 14px}.name{display:flex;align-items:center;justify-content:space-between;font-size:14px}.tag{color:#9caaab;font-size:10px;letter-spacing:1px}.key{font:10px ui-monospace,monospace;color:#7e899e;margin-top:7px}.note{color:#9ea6b6;font-size:12px;margin-top:22px;line-height:1.8}dialog{color:inherit;max-width:800px;width:calc(100% - 32px);border:1px solid #5d6877;border-radius:10px;background:#1d2330;padding:24px}dialog::backdrop{background:#080c14cc}dialog .top{display:flex;justify-content:space-between;align-items:center}dialog h2{margin:0;font-size:22px}dialog canvas{width:min(512px,100%);height:auto;margin:20px auto;background:#293140}.controls{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}.frame{font:12px monospace;color:#bdc5cd;min-width:120px;text-align:center}.links{display:flex;justify-content:center;gap:10px;margin-top:20px}a{color:#c8dbc6}.error{color:#ffa899}@media(max-width:950px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.stats{gap:14px}.stats strong{font-size:24px}}@media(max-width:600px){main{padding:24px 14px}header{display:block}h1{font-size:28px}.stats{margin-top:20px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stage{height:164px}.card canvas{width:160px;height:160px}.toolbar .spacer{display:none}.key{font-size:9px}}
</style>
<main>
<header><div><div class="eyebrow">BATTLE SIMULATION / PIXEL ATELIER</div><h1>작은 몸에 담은 모험</h1><p class="intro">직업과 마물, 소환물의 64픽셀 초상.<br>카드를 누르면 동작을 확대하고 프레임별로 살펴볼 수 있습니다.</p></div><div class="stats"><div><strong>31</strong><span>캐릭터</span></div><div><strong>744</strong><span>프레임</span></div><div><strong>6</strong><span>동작</span></div></div></header>
<div class="toolbar" id="toolbar"><button data-anim="idle" class="on">대기</button><button data-anim="walk">걷기</button><button data-anim="attack">공격</button><button data-anim="cast">시전</button><button data-anim="hit">피격</button><button data-anim="death">쓰러짐</button><span class="spacer"></span><select id="filter" aria-label="캐릭터 종류"><option value="all">전체 31종</option value="job">직업 9종</option><option value="monster">몬스터 18종</option><option value="summon">소환물 4종</option></select><button id="pause">일시정지</button></div>
<div class="grid" id="grid"></div><p class="note">64 × 64 원본 · 정수 배율 · 투명 PNG · 편집 가능한 Aseprite 원본<br>전투에서는 공격·피격·쓰러짐이 한 번 재생됩니다. 이 화면에서는 비교를 위해 끝 자세를 잠시 유지한 뒤 반복합니다.</p>
</main>
<dialog id="detail"><div class="top"><h2 id="title"></h2><button id="close">닫기</button></div><canvas id="large" width="512" height="512"></canvas><div class="controls"><button id="prev">← 이전 프레임</button><span id="frame" class="frame"></span><button id="next">다음 프레임 →</button><button id="play">재생 / 정지</button></div><div class="links"><a id="source" class="button">Aseprite 원본</a><a id="sheet" class="button" target="_blank">PNG 시트</a></div></dialog>
<script>
const entries=[['swordsman','검사'],['tank','탱커'],['berserker','버서커'],['assassin','암살자'],['archer','궁수'],['sniper','저격수'],['mage','마법사'],['summoner','소환사'],['healer','힐러'],['monster_slime_swarm','슬라임 무리'],['monster_wild_dogs','들개 떼'],['monster_goblin_scouts','고블린 정찰조'],['monster_cave_bats','동굴 박쥐 떼'],['monster_mushroom_grove','독버섯 군락'],['monster_giant_slime','거대 슬라임'],['monster_orc_warband','오크 전사대'],['monster_harpy_flock','하피 무리'],['monster_living_armor','리빙 아머'],['monster_bandit_crew','도적단'],['monster_wraith_choir','망령 성가대'],['monster_orc_chieftain','오크 대족장'],['monster_ancient_golem','고대 골렘'],['monster_frost_dragon','서리 드래곤'],['monster_inferno_lord','화염 거인'],['monster_lich_host','리치의 군세'],['monster_abyss_pack','심연의 마수 무리'],['monster_demon_legion','마신 군단'],['summon_beast','야수'],['summon_spirit','정령'],['summon_skeleton','해골'],['summon_turret','화살탑']];
const specs={idle:[0,4,6,true],walk:[1,6,10,true],attack:[2,4,12,false],cast:[3,4,8,true],hit:[4,2,10,false],death:[5,4,8,false]};
const base=location.protocol==='file:'?'../public/sprites/':'../sprites/';
const grid=document.querySelector('#grid'),dialog=document.querySelector('#detail');
let animation='idle',playing=true,time=0,last=performance.now(),selected=null,manual=null;
const cards=entries.map(([key,name])=>{const type=key.startsWith('monster_')?'monster':key.startsWith('summon_')?'summon':'job';const button=document.createElement('button');button.className='card';button.setAttribute('aria-label',name+' 확대');button.innerHTML=`<div class="stage"><canvas width="192" height="192"></canvas></div><div class="info"><div class="name">${name}<span class="tag">${{job:'직업',monster:'몬스터',summon:'소환물'}[type]}</span></div><div class="key">${key}</div></div>`;const img=new Image();img.src=base+key+'.png';img.onerror=()=>button.classList.add('error');const card={key,name,type,img,button,canvas:button.querySelector('canvas')};button.onclick=()=>{selected=card;manual=null;document.querySelector('#title').textContent=name;document.querySelector('#source').href='aseprite/'+key+'.aseprite';document.querySelector('#sheet').href=img.src;dialog.showModal()};grid.append(button);return card});
function currentFrame(){const [,n,fps,loop]=specs[animation];const raw=Math.floor(time*fps);return loop?raw%n:Math.min(n-1,raw%(n+Math.round(fps*.75)))}
function draw(card,canvas,f){if(!card.img.complete||!card.img.naturalWidth)return;const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);ctx.imageSmoothingEnabled=false;ctx.drawImage(card.img,f*64,specs[animation][0]*64,64,64,0,0,canvas.width,canvas.height)}
function tick(now){if(playing)time+=(now-last)/1000;last=now;const f=currentFrame();for(const card of cards)if(!card.button.hidden)draw(card,card.canvas,f);if(dialog.open&&selected){const sf=manual??f;draw(selected,document.querySelector('#large'),sf);document.querySelector('#frame').textContent=`${animation}  ${sf+1} / ${specs[animation][1]}`}requestAnimationFrame(tick)}requestAnimationFrame(tick);
document.querySelectorAll('[data-anim]').forEach(b=>b.onclick=()=>{animation=b.dataset.anim;time=0;manual=null;document.querySelectorAll('[data-anim]').forEach(x=>x.classList.toggle('on',x===b))});
document.querySelector('#filter').onchange=e=>cards.forEach(c=>c.button.hidden=e.target.value!=='all'&&c.type!==e.target.value);
document.querySelector('#pause').onclick=e=>{playing=!playing;e.target.textContent=playing?'일시정지':'재생'};
document.querySelector('#close').onclick=()=>dialog.close();
document.querySelector('#prev').onclick=()=>manual=((manual??currentFrame())-1+specs[animation][1])%specs[animation][1];
document.querySelector('#next').onclick=()=>manual=((manual??currentFrame())+1)%specs[animation][1];
document.querySelector('#play').onclick=()=>manual=manual===null?currentFrame():null;
</script>
</html>
